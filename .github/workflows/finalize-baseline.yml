name: Finalize September baseline

on:
  push:
    branches:
      - main
    paths:
      - '.finalize-baseline'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate baseline
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .upload/current/seg00.txt \
            .upload/current/seg01.txt \
            .upload/current/seg02.txt \
            .upload/current/part03.txt \
            .upload/current/gap.txt \
            .upload/current/part04.txt \
            .upload/current/part05.txt \
            .upload/current/rem00.txt \
            .upload/current/rem01.txt \
            .upload/current/rem02.txt \
            .upload/current/rem03a.txt \
            .upload/current/rem03b.txt \
            .upload/current/rem04.txt \
            .upload/current/rem05.txt \
            > /tmp/export.b64

          test "$(wc -c < /tmp/export.b64)" -eq 182032
          base64 -d /tmp/export.b64 > /tmp/export.xls.xz
          echo "4dc6174a8604c5de1835d456ba42c3ac57a06f5c2208e57046691d1cfcc5a54a  /tmp/export.xls.xz" | sha256sum -c -
          xz -t /tmp/export.xls.xz

          mkdir -p data/raw
          rm -f data/raw/*.xls
          xz -dc /tmp/export.xls.xz > data/raw/tasks_2026-09-16_09-52-52.xls
          echo "d7147c1dd5294347a04d784f4dc866d2c3a883c6ff572089421381ee86f9999e  data/raw/tasks_2026-09-16_09-52-52.xls" | sha256sum -c -

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ExportParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.headers = 0
                  self.rows = 0
                  self.ids = []
                  self.in_tbody = False
                  self.in_tr = False
                  self.in_td = False
                  self.current_cells = []
                  self.current_text = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'th':
                      self.headers += 1
                  elif tag == 'tbody':
                      self.in_tbody = True
                  elif tag == 'tr' and self.in_tbody:
                      self.in_tr = True
                      self.current_cells = []
                  elif tag == 'td' and self.in_tr:
                      self.in_td = True
                      self.current_text = []

              def handle_endtag(self, tag):
                  if tag == 'td' and self.in_td:
                      self.current_cells.append(''.join(self.current_text).strip())
                      self.in_td = False
                  elif tag == 'tr' and self.in_tr:
                      if self.current_cells:
                          self.rows += 1
                          self.ids.append(self.current_cells[0])
                      self.in_tr = False
                  elif tag == 'tbody':
                      self.in_tbody = False

              def handle_data(self, data):
                  if self.in_td:
                      self.current_text.append(data)

          path = Path('data/raw/tasks_2026-09-16_09-52-52.xls')
          parser = ExportParser()
          parser.feed(path.read_text(encoding='utf-8-sig'))
          assert parser.headers == 44, parser.headers
          assert parser.rows == 498, parser.rows
          assert len(parser.ids) == len(set(parser.ids)), 'duplicate task IDs'
          print(f'Validated: {parser.rows} tasks, {parser.headers} columns, unique task IDs')
          PY

          cat > data/exports.json <<'JSON'
          {
            "files": [
              "tasks_2026-09-16_09-52-52.xls"
            ]
          }
          JSON

      - name: Commit clean baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload data/.refresh
          rm -f .finalize-baseline
          rm -f .github/workflows/finalize-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set 2026-09-16 task export as clean baseline"
          git push origin HEAD:main
